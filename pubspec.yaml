name: wastmobile
description: "Bɔla Aba - On-demand waste collection"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  provider: ^6.1.5+1
  geolocator: ^14.0.2
  google_maps_flutter: ^2.9.0
  latlong2: ^0.9.1
  shared_preferences: ^2.3.3
  web_socket_channel: ^3.0.1
  flutter_local_notifications: ^18.0.1
  url_launcher: ^6.3.1
  audioplayers: ^6.7.1
  fl_chart: ^1.2.0
  image_picker: ^1.2.2
  cached_network_image: ^3.4.1
  http_parser: ^4.1.2
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/bolaaba_logo.png
    - .env
